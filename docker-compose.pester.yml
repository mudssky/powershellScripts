# docker-compose.pester.yml
# Linux-local Pester test orchestration
# Usage:
#   docker compose -f docker-compose.pester.yml run --rm pester-fast
#   docker compose -f docker-compose.pester.yml run --rm pester-full

services:
  pester-fast:
    build:
      context: .
      dockerfile: Dockerfile.pester
    volumes:
      - .:/workspace
      - pester-results:/workspace-output
    tmpfs:
      # Docker tmpfs 默认 noexec；Pester $TestDrive 落在 /tmp，
      # 测试内构造的 scoop shim 等可执行脚本必须保留 exec 位才能被子进程启动。
      - /tmp:exec
    working_dir: /workspace
    environment:
      - PWSH_TEST_MODE=fast
      - PESTER_RESULT_PATH=/workspace-output/testResults-linux.xml
      - CI=false
    command: pwsh -NoProfile -File ./scripts/pwsh/devops/Invoke-PesterMode.ps1 -Mode fast

  pester-full:
    build:
      context: .
      dockerfile: Dockerfile.pester
    volumes:
      - .:/workspace
      - pester-results:/workspace-output
    tmpfs:
      # Docker tmpfs 默认 noexec；Pester $TestDrive 落在 /tmp，
      # 测试内构造的 scoop shim 等可执行脚本必须保留 exec 位才能被子进程启动。
      - /tmp:exec
    working_dir: /workspace
    environment:
      - PWSH_TEST_MODE=full
      # Linux 容器当前命中 Pester coverage 收尾异常，先保留 full 断言回归，
      # 将 coverage 责任收敛到 host full，避免聚合命令因为已知兼容性问题假红。
      - PWSH_TEST_ENABLE_COVERAGE=false
      - PESTER_RESULT_PATH=/workspace-output/testResults-linux.xml
      - CI=false
    command: pwsh -NoProfile -File ./scripts/pwsh/devops/Invoke-PesterMode.ps1 -Mode full -Coverage Off

volumes:
  pester-results:
